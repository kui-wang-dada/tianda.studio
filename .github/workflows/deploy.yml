name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force-frontend:
        description: 'Force deploy frontend'
        required: false
        default: 'false'
      force-admin:
        description: 'Force deploy admin'
        required: false
        default: 'false'
      force-api:
        description: 'Force deploy api'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend || github.event.inputs.force-frontend }}
      admin: ${{ steps.filter.outputs.admin || github.event.inputs.force-admin }}
      api: ${{ steps.filter.outputs.api || github.event.inputs.force-api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'content/**'
              - 'scripts/deploy-frontend.sh'
              - '.github/workflows/deploy.yml'
            admin:
              - 'admin/**'
              - 'scripts/deploy-admin.sh'
              - '.github/workflows/deploy.yml'
            api:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy.yml'

  # Frontend → ssh 到 VPS：git pull → pnpm build → 原子替换 /srv/tianda-web/web
  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Build & deploy frontend on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/tianda-web/repo
            git fetch --depth=1 origin main
            git reset --hard origin/main
            ./scripts/deploy-frontend.sh

  # Admin → ssh 到 VPS：git pull → pnpm build → 原子替换 /srv/tianda-web/admin
  deploy-admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Build & deploy admin on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/tianda-web/repo
            git fetch --depth=1 origin main
            git reset --hard origin/main
            ./scripts/deploy-admin.sh

  # API → 镜像走 GHCR（仍需要构建环境，VPS 上跑构建会拉满 CPU/IO，这条保留）
  deploy-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/tianda-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/tianda-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=api

      - name: Restart api on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/tianda-web
            export TAG=${{ github.sha }}
            docker compose pull api
            docker compose up -d --no-deps api db
            sleep 6
            docker compose exec -T api curl -fsS http://localhost:8000/api/v1/health || (docker compose logs api && exit 1)
